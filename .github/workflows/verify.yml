name: Verify PermitScope
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/transactions.test.mjs
      - run: genvm-lint check contracts/permit_scope.py
      - run: npm run build
